{{- if and .Values.tcpProxy.enabled .Values.sessions.portModeEnabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clearmlAgent.fullname" . }}-tcp-proxy
  labels:
    {{- include "clearmlAgent.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "clearmlAgent.fullname" . }}-tcp-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "clearmlAgent.fullname" . }}-tcp-proxy
    spec:
      containers:
        - name: tcp-proxy
          image: {{ .Values.tcpProxy.image.repository }}:{{ .Values.tcpProxy.image.tag }}
          args:
            - /bin/sh
            - -c
            - |
              set -eu
              cat > /etc/nginx/nginx.conf <<'NGINX'
              worker_processes  1;
              events { worker_connections  1024; }
              stream {
                {{- range untilStep 1 ( ( add .Values.sessions.maxServices 1 ) | int ) 1 }}
                server {
                  listen {{ add $.Values.sessions.startingPort . }};
                  proxy_connect_timeout 10s;
                  proxy_timeout 600s;
                  proxy_pass {{ include "clearmlAgent.fullname" $ }}-session-{{ . }}:{{ add $.Values.sessions.startingPort . }};
                }
                {{- end }}
              }
              NGINX
              exec nginx -g 'daemon off;'
          ports:
            {{- range untilStep 1 ( ( add .Values.sessions.maxServices 1 ) | int ) 1 }}
            - name: p{{ add $.Values.sessions.startingPort . }}
              containerPort: {{ add $.Values.sessions.startingPort . }}
              protocol: TCP
            {{- end }}
          resources:
            {{- toYaml .Values.tcpProxy.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clearmlAgent.fullname" . }}-tcp-proxy
  labels:
    {{- include "clearmlAgent.labels" . | nindent 4 }}
  {{- with .Values.tcpProxy.svcAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.tcpProxy.svcType }}
  selector:
    app.kubernetes.io/name: {{ include "clearmlAgent.fullname" . }}-tcp-proxy
  ports:
    {{- range untilStep 1 ( ( add .Values.sessions.maxServices 1 ) | int ) 1 }}
    - name: p{{ add $.Values.sessions.startingPort . }}
      port: {{ add $.Values.sessions.startingPort . }}
      targetPort: {{ add $.Values.sessions.startingPort . }}
      protocol: TCP
    {{- end }}
{{- end }}
